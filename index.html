<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>USCCS Match Ribbon</title>
<style>
  :root { --navy: #11213F; --gold: #E7C247; --bg: #F4F6FA; --border: #E1E5EC; --gray: #5A6472; --success: #1E7A46; --danger: #C0392B; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; color: #1a1a1a; }
  main { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
  .muted { color: var(--gray); font-size: 13px; }

  .ribbon-block { background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }

  /* Divider between the two rows: a single bar carrying both labels, each
     paired with a small color swatch that matches the accent stripe on its
     row, so the color-to-gender mapping is visible in one glance instead
     of needing two separate full-width headers. */
  .ribbon-divider { display: flex; align-items: center; justify-content: center; gap: 28px; padding: 7px 16px; background: var(--bg); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .divider-tag { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--navy); }
  .divider-swatch { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto; }
  .divider-swatch.men { background: var(--navy); }
  .divider-swatch.women { background: var(--gold); }

  .ribbon-row { display: flex; align-items: center; gap: 10px; overflow-x: hidden; padding: 10px; }
  .ribbon-row.men { box-shadow: inset 4px 0 0 var(--navy); }
  .ribbon-row.women { box-shadow: inset 4px 0 0 var(--gold); }

  .game-card { flex: 0 0 auto; width: 190px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-size: 15px; }
  .game-card .team-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .game-card .team-logo { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 4px; object-fit: contain; background: #fff; border: 1px solid var(--border); }
  .game-card .team-name { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; color: #1a1a1a; }
  .game-card .team-score { margin-left: auto; }
  .game-card .team-score { flex: 0 0 auto; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
  .game-card .team-row.winner .team-name, .game-card .team-row.winner .team-score { color: var(--success); }
  .game-card .game-time { margin-top: 8px; color: var(--gray); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty-row { padding: 30px; text-align: center; width: 100%; }
  #loadingMsg, #errorMsg { padding: 40px; text-align: center; }
  #errorMsg { color: var(--danger); display: none; }
  .reload-btn { margin-top: 10px; padding: 7px 14px; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--navy); font-size: 13px; cursor: pointer; }
  .reload-btn:hover { background: var(--bg); }
</style>
</head>
<body>
<main>
  <div id="loadingMsg" class="muted">Loading recent results…</div>
  <div id="errorMsg"></div>

  <div id="ribbonContent" style="display:none;">
    <div class="ribbon-block">
      <div class="ribbon-row men" id="menRow"></div>
      <div class="ribbon-divider">
        <span class="divider-tag"><span class="divider-swatch men"></span>Men's</span>
        <span class="divider-tag"><span class="divider-swatch women"></span>Women's</span>
      </div>
      <div class="ribbon-row women" id="womenRow"></div>
    </div>
  </div>
</main>

<script>
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function formatWindowRange(startIso, endIso) {
    const start = new Date(startIso);
    const end = new Date(endIso);
    const fmt = (d) => d.toLocaleDateString('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric' });
    return fmt(start) + ' – ' + fmt(end);
  }

  function formatGameTime(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleString('en-US', {
      timeZone: 'America/New_York', weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
    }) + ' ET';
  }

  // One small card: division name, home/away team names with the score
  // between them, and the game's date/time. The winning team's row is
  // highlighted green for a game with a clear winner (left neutral for a
  // tie, or if a score isn't in yet).
  function gameCardHtml(g) {
    const home = escapeHtml(g.homeTeam || 'TBD');
    const away = escapeHtml(g.awayTeam || 'TBD');
    const hasScore = g.homeScore != null && g.awayScore != null;
    const homeWins = hasScore && g.homeScore > g.awayScore;
    const awayWins = hasScore && g.awayScore > g.homeScore;

    const homeLogo = g.homeTeamLogoUrl
      ? `<img class="team-logo" src="${escapeHtml(g.homeTeamLogoUrl)}" alt="" onerror="this.style.display='none'" />`
      : '';
    const awayLogo = g.awayTeamLogoUrl
      ? `<img class="team-logo" src="${escapeHtml(g.awayTeamLogoUrl)}" alt="" onerror="this.style.display='none'" />`
      : '';

    return `
      <div class="game-card" title="${home} vs ${away}">
        <div class="team-row ${homeWins ? 'winner' : ''}">
          ${homeLogo}
          <span class="team-name">${home}</span>
          <span class="team-score">${hasScore ? g.homeScore : '—'}</span>
        </div>
        <div class="team-row ${awayWins ? 'winner' : ''}">
          ${awayLogo}
          <span class="team-name">${away}</span>
          <span class="team-score">${hasScore ? g.awayScore : '—'}</span>
        </div>
        <div class="game-time">${formatGameTime(g.startTime)}</div>
      </div>
    `;
  }

  // Continuously auto-scrolls a row left-to-right (most recent -> oldest)
  // at a slow, steady pace, looping seamlessly forever. The trick: the
  // row's cards are rendered TWICE back-to-back (see renderRow), so once
  // scrollLeft passes the width of one full copy, we snap it back by that
  // same width - since the second copy is identical to the first, the jump
  // is invisible and the ticker appears to loop endlessly. Pauses on
  // hover/touch so someone can actually read a card.
  const SCROLL_PX_PER_SEC = 28;

  function startAutoScroll(container) {
    let paused = false;
    let rafId = null;
    let lastTs = null;

    container.addEventListener('mouseenter', () => { paused = true; });
    container.addEventListener('mouseleave', () => { paused = false; });
    container.addEventListener('touchstart', () => { paused = true; }, { passive: true });
    container.addEventListener('touchend', () => { paused = false; });

    function step(ts) {
      if (lastTs == null) lastTs = ts;
      const dtSeconds = (ts - lastTs) / 1000;
      lastTs = ts;

      const loopWidth = parseFloat(container.dataset.loopWidth || '0');
      if (!paused && loopWidth > 0) {
        container.scrollLeft += SCROLL_PX_PER_SEC * dtSeconds;
        if (container.scrollLeft >= loopWidth) {
          container.scrollLeft -= loopWidth;
        }
      }
      rafId = requestAnimationFrame(step);
    }

    // Cancel any previous loop on this container before starting a new one
    // (loadRibbon re-renders periodically-ish via manual reload).
    if (container._autoScrollRafId) cancelAnimationFrame(container._autoScrollRafId);
    rafId = requestAnimationFrame(step);
    container._autoScrollRafId = rafId;
  }

  // Renders one gender's row, most recent game first through oldest last -
  // the API returns oldest-first, so reverse it here. The card set is
  // duplicated back-to-back so the auto-scroll loop (see startAutoScroll)
  // has a second identical copy to snap back to, making the loop seamless.
  function renderRow(container, games) {
    if (!games.length) {
      container.innerHTML = '<div class="empty-row muted">No results in the last 7 days.</div>';
      container.dataset.loopWidth = '0';
      return;
    }
    const cardsHtml = games.slice().reverse().map(gameCardHtml).join('');
    container.innerHTML = cardsHtml + cardsHtml;
    container.scrollLeft = 0;

    // Measure after the browser has laid out the duplicated content - one
    // "loop width" is half the full scrollWidth, i.e. the width of a
    // single copy of the cards.
    requestAnimationFrame(() => {
      container.dataset.loopWidth = String(container.scrollWidth / 2);
    });

    startAutoScroll(container);
  }

  async function loadRibbon() {
    document.getElementById('loadingMsg').style.display = 'block';
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('ribbonContent').style.display = 'none';

    try {
      const res = await fetch('/api/ribbon');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load results');

      renderRow(document.getElementById('menRow'), data.men);
      renderRow(document.getElementById('womenRow'), data.women);

      document.getElementById('loadingMsg').style.display = 'none';
      document.getElementById('ribbonContent').style.display = 'block';
    } catch (e) {
      document.getElementById('loadingMsg').style.display = 'none';
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'block';
      errEl.innerHTML = 'Failed to load recent results: ' + escapeHtml(e.message) + '<br /><button class="reload-btn" onclick="loadRibbon()">Try again</button>';
    }
  }

  loadRibbon();
</script>
</body>
</html>
